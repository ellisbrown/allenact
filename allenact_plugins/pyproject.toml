[build-system]
requires      = ["setuptools>=69.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "allenact-plugins"
version         = "0.5.6"
description     = "Official plugin collection for AllenAct"
authors         = [
    { name="Allen Institute for AI", email="lucaw@allenai.org" },
]
license         = { text = "MIT" }
requires-python = ">=3.8"
dependencies    = ["allenact"]      # plus any plugin-specific deps

# tell setuptools to find packages in the current directory
[tool.setuptools]
packages = ["allenact_plugins"]
package-dir = {"allenact_plugins" = "."}

[tool.setuptools.package-data]
allenact_plugins = ["**/*.py"]
